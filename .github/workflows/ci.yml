name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: uv sync --extra dev
        
      - name: Run pytest
        run: uv run pytest tests/
        
      - name: Run black
        run: uv run black --check airflow_api_client/ tests/
        
      - name: Run isort
        run: uv run isort --check airflow_api_client/ tests/
        
      - name: Run pylint
        run: uv run pylint --rcfile=pyproject.toml airflow_api_client/ tests/
