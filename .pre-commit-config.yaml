repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run black
        language: system
        types: [python]
        pass_filenames: false
        args: [airflow_api_client/, tests/]
      - id: isort
        name: isort
        entry: uv run isort
        language: system
        types: [python]
        pass_filenames: false
        args: [airflow_api_client/, tests/]
      - id: pylint
        name: pylint
        entry: uv run pylint
        language: system
        types: [python]
        pass_filenames: false
        args: [--rcfile=pyproject.toml, airflow_api_client/]
