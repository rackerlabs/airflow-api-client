[project]
name = "airflow-api-client"
version = "0.1.0"
description = "Interact with Apache Airflow through its API. Trigger and list DAGs etc."
authors = [
    {name = "Erik Ljungstrom",email = "erik.ljungstrom@rackspace.co.uk"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "structlog>=25.5.0,<26.0.0",
    "apache-airflow-client>=3.1.6,<4.0.0",
    "requests>=2.32.5,<3.0.0",
    "tabulate>=0.9.0",
    "jmespath>=1.1.0",
]

[project.entry-points."airflow_api_client.auth"]
default = "airflow_api_client.auth:AirflowAPIClientAuthProvider"

[project.scripts]
airflow-api-client = "airflow_api_client.main:cli"

[project.optional-dependencies]
dev = [
    "pylint>=3.3.5",
    "black>=26.3.1",
    "isort>=5.13.2",
    "flake8>=7.3.0",
    "pytest>=9.0.3",
]
keyring = [
    "keyring>=25.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.isort]
line_length = 100
profile = "black"

[tool.pylint.format]
max-line-length = 100

[tool.pylint.messages_control]
disable = ["duplicate-code"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.flake8]
line-length = 100

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
]
