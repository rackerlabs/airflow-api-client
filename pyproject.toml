[project]
name = "airflow-api-client"
version = "0.1.0"
description = "Interact with Apache Airflow through its API. Trigger and list DAGs etc."
authors = [
    {name = "Erik Ljungstrom",email = "erik.ljungstrom@rackspace.co.uk"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "structlog (>=25.5.0,<26.0.0)",
    "apache-airflow-client (>=3.1.6,<4.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "tabulate (>=0.9.0)"
]

[project.scripts]
airflow-api-client = "airflow_api_client.main:cli"

[tool.poetry]

[tool.poetry.group.dev.dependencies]
pylint = "^3.3.5"
black = "^25.1.0"
isort = "^5.13.2"
flake8 = "^7.3.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
line_length = 100
profile = "black"

[tool.pylint.format]
max-line-length = 100

[tool.black]
line-length = 100

[tool.flake8]
line-length = 100
